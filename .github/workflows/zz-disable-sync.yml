name: zz disable auto sync

# 一次性：把上游自带的定时同步（sync-upstream.yml）在仓库层面禁用，
# 以后不会自己跟上游发版、也不会自己派发部署。用完就删。
# 想恢复：Actions 左侧选 Sync Upstream → Enable workflow，或告诉我重新开。

on:
  push:
    paths:
      - ".github/workflows/zz-disable-sync.yml"

permissions:
  actions: write
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - name: Disable sync-upstream workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-upstream.yml/disable" && echo "✅ sync-upstream 已禁用"
          echo "---- 当前所有 workflow 状态 ----"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --jq '.workflows[] | "\(.name) [\(.path)]: \(.state)"'
