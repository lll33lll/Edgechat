name: 🔍 一次性自检 / temporary self-check

# 临时文件：用 actionlint 校验刚加的 sync-upstream.yml，并探测上游状态。
# 结果写进仓库根的 SELFCHECK_REPORT.md，跑完这两个文件都会被删掉。

on:
  push:
    paths:
      - ".github/workflows/_selfcheck.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  check:
    name: 🔍 校验
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 检出代码 / Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⬇️ 下载 actionlint
        run: curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash

      - name: 🧪 校验 sync-upstream.yml
        id: lint
        continue-on-error: true
        run: |
          ./actionlint -shellcheck= -pyflakes= .github/workflows/sync-upstream.yml 2>&1 | tee lint.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 🔎 探测上游状态 / Probe upstream
        id: probe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name // empty' > upstream.txt 2>&1
          UPSTREAM=$(head -n1 upstream.txt)
          [ -z "$UPSTREAM" ] && UPSTREAM="aozorae/Edgechat"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream "$GITHUB_REF_NAME"
          BASE=$(git merge-base HEAD "upstream/${GITHUB_REF_NAME}")
          git rev-list --count "HEAD..upstream/${GITHUB_REF_NAME}" > behind.txt
          git rev-list --count "upstream/${GITHUB_REF_NAME}..HEAD" > ahead.txt
          git diff --name-only "${BASE}..upstream/${GITHUB_REF_NAME}" -- .github/workflows | wc -l > wf.txt
          gh run list --workflow deploy-worker.yml --limit 1 --json databaseId,conclusion > runlist.txt 2>&1
          exit 0

      - name: 📝 写报告并提交 / Commit report
        if: always()
        run: |
          {
            echo "# selfcheck report"
            echo ""
            echo "- lint_outcome: ${{ steps.lint.outcome }}"
            echo "- lint_exit: ${{ steps.lint.outputs.exit }}"
            echo "- probe_outcome: ${{ steps.probe.outcome }}"
            echo "- upstream: \`$(head -n1 upstream.txt 2>/dev/null)\`"
            echo "- behind: \`$(cat behind.txt 2>/dev/null)\`"
            echo "- ahead: \`$(cat ahead.txt 2>/dev/null)\`"
            echo "- upstream_changed_workflow_files: \`$(cat wf.txt 2>/dev/null)\`"
            echo "- deploy_runlist: \`$(cat runlist.txt 2>/dev/null | tr -d '\n')\`"
            echo ""
            echo "## actionlint output"
            echo ""
            echo '```'
            cat lint.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } > SELFCHECK_REPORT.md

          cat SELFCHECK_REPORT.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SELFCHECK_REPORT.md
          git commit -m "chore: selfcheck report" || echo "nothing to commit"
          git push origin HEAD:master || echo "::error:: push 失败，GITHUB_TOKEN 可能没有 contents write 权限"
