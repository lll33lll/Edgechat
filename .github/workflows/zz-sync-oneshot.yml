name: zz 一次性同步上游 / One-shot upstream sync

# 由 MCP 推这个文件触发（on: push 自身），做两件事：
#   1) 把 aozorae/Edgechat 的最新提交合并进 master，但「不」改 .github/workflows，
#      以免内置 GITHUB_TOKEN 因为没有 workflows 写权限而被拒；
#   2) 跑完显式 dispatch Deploy Worker（内置 token 推的提交不会自动触发 workflow）。
# 同步完成后新的 workflow 文件由 MCP 单独推（新版 workflow 一旦落库就能靠 push 触发部署）。

on:
  push:
    paths:
      - ".github/workflows/zz-sync-oneshot.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: zz-sync-oneshot
  cancel-in-progress: false

jobs:
  sync:
    name: 合并上游 + 触发部署
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream（跳过 workflows）
        continue-on-error: true
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/aozorae/Edgechat.git
          git fetch --no-tags upstream master

          UP=$(git rev-parse --short upstream/master)
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "upstream = $UP, 落后 $BEHIND 个提交"

          if [ "$BEHIND" = "0" ]; then
            echo "✅ 已是最新，无需合并"
            exit 0
          fi

          BEFORE=$(git rev-parse HEAD)
          git log --oneline HEAD..upstream/master | head -40
          # 三方合并，冲突一律以上游为准；不自动提交，先把 workflows 恢复成我们自己的
          git merge --no-ff --no-commit -X theirs upstream/master || true
          git checkout "$BEFORE" -- .github/workflows
          git commit -m "chore: 同步上游 aozorae/Edgechat @${UP}（workflow 由 MCP 单独推）"
          git --no-pager diff --stat "$BEFORE" HEAD | tail -20
          git push origin HEAD:master
          echo "✅ 代码已推送"

      - name: Dispatch deploy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh workflow run deploy-worker.yml --ref master && echo "🚀 已触发 Deploy Worker" || echo "::warning::没能自动触发部署"
